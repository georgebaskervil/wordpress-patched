name: sync-wordpress-patched

# Keeps ghcr.io/<owner>/wordpress-patched:php8.3-apache on the newest PHP 8.3.x:
#   - official wordpress:php8.3-apache already has it  -> mirror the official image (multi-arch)
#   - official image is behind, ours is behind too     -> build PHP + WordPress from the official sources (amd64)
#   - official image is behind, ours is already newest -> leave it alone
# Once Docker catches up, this becomes a plain mirror and nothing needs switching back.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

env:
  BRANCH: "8.3"
  OFFICIAL: wordpress:php8.3-apache

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling resets that timer
      - name: Keep scheduled runs alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sync.yml/enable"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what to do
        id: plan
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          rolling="ghcr.io/${owner}/wordpress-patched:php${BRANCH}-apache"
          required=$(curl -fsS "https://www.php.net/releases/?json&version=${BRANCH}" | jq -r .version)
          official=$(docker run --rm "$OFFICIAL" php -r 'echo PHP_VERSION;')
          ours=$(docker run --rm "$rolling" php -r 'echo PHP_VERSION;' 2>/dev/null || echo 0)
          echo "required=$required official=$official ours=$ours"

          ge() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          if ge "$official" "$required"; then
            mode=mirror
          elif ge "$ours" "$required"; then
            mode=none
          else
            mode=build
          fi
          echo "mode=$mode"

          if [ "$mode" = mirror ]; then
            official_digest=$(docker buildx imagetools inspect --raw "$OFFICIAL" | sha256sum | cut -d' ' -f1)
            ours_digest=$(docker buildx imagetools inspect --raw "$rolling" 2>/dev/null | sha256sum | cut -d' ' -f1)
            [ "$official_digest" = "$ours_digest" ] && mode=none
            echo "official_digest=$official_digest ours_digest=$ours_digest mode=$mode"
          fi

          {
            echo "mode=$mode"
            echo "rolling=$rolling"
            echo "required=$required"
          } >> "$GITHUB_OUTPUT"

      - name: Mirror the official image
        if: steps.plan.outputs.mode == 'mirror'
        run: docker buildx imagetools create -t "${{ steps.plan.outputs.rolling }}" "$OFFICIAL"

      - uses: actions/checkout@v7
        if: steps.plan.outputs.mode == 'build'
        with:
          repository: docker-library/php
          path: php

      - uses: actions/checkout@v7
        if: steps.plan.outputs.mode == 'build'
        with:
          repository: docker-library/wordpress
          path: wordpress

      - name: Build PHP base image
        if: steps.plan.outputs.mode == 'build'
        env:
          REQUIRED: ${{ steps.plan.outputs.required }}
        run: |
          grep -n 'ENV PHP_VERSION' "php/${BRANCH}/trixie/apache/Dockerfile"
          grep -qx "ENV PHP_VERSION ${REQUIRED}" "php/${BRANCH}/trixie/apache/Dockerfile"
          docker build -t "php-base:${REQUIRED}-apache" "php/${BRANCH}/trixie/apache"
          docker run --rm "php-base:${REQUIRED}-apache" php -v | tee /dev/stderr | grep -q "PHP ${REQUIRED} "

      - name: Build WordPress image on it
        if: steps.plan.outputs.mode == 'build'
        working-directory: wordpress/latest/php8.3/apache
        env:
          REQUIRED: ${{ steps.plan.outputs.required }}
          ROLLING: ${{ steps.plan.outputs.rolling }}
        run: |
          sed -i "s|^FROM php:${BRANCH}-apache\$|FROM php-base:${REQUIRED}-apache|" Dockerfile
          grep -qx "FROM php-base:${REQUIRED}-apache" Dockerfile
          docker build -t "$ROLLING" .

      - name: Verify the image
        if: steps.plan.outputs.mode == 'build'
        env:
          REQUIRED: ${{ steps.plan.outputs.required }}
          ROLLING: ${{ steps.plan.outputs.rolling }}
        run: |
          docker run --rm "$ROLLING" php -v | tee /dev/stderr | grep -q "PHP ${REQUIRED} "
          mods=$(docker run --rm "$ROLLING" php -m)
          for e in bcmath exif gd imagick intl mysqli zip "Zend OPcache"; do
            echo "$mods" | grep -qix "$e" || { echo "missing PHP module: $e"; exit 1; }
          done
          docker run --rm "$ROLLING" apache2ctl -t 2>&1 | tee /dev/stderr | grep -q "Syntax OK"

      - name: Push
        if: steps.plan.outputs.mode == 'build'
        run: docker push "${{ steps.plan.outputs.rolling }}"
