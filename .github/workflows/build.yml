name: build-wordpress-patched

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Server arch: x86_64 = linux/amd64, aarch64 = linux/arm64"
        default: linux/amd64

env:
  PHP_VERSION: "8.3.36"
  # docker-library/wordpress master as of 2026-10-21; latest/php8.3/apache unchanged since "Update latest to 7.1.3"
  UPSTREAM_SHA: 2d7faab7fb71508e6854cdbed948c195957f279e

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: docker-library/wordpress
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Pin PHP base image
        working-directory: upstream/latest/php8.3/apache
        run: |
          sed -i "s|^FROM php:8.3-apache\$|FROM php:${PHP_VERSION}-apache|" Dockerfile
          grep -qx "FROM php:${PHP_VERSION}-apache" Dockerfile
          grep -n '^FROM' Dockerfile

      - name: Set image name
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/wordpress-patched:${PHP_VERSION}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: upstream/latest/php8.3/apache
          platforms: ${{ inputs.platforms }}
          pull: true
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}

      - name: Verify PHP version in the pushed image
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          docker run --rm --platform "${PLATFORMS%%,*}" "$IMAGE" php -v | tee /dev/stderr | grep -q "PHP ${PHP_VERSION}"
